<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consistency — Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark">✓</span>
        <span class="brand-name">Consistency</span>
      </div>
      <span id="today-date" class="today-date"></span>
    </div>
  </header>

  <main class="container">
    <!-- Summary blocks -->
    <section class="summary-grid">
      <div class="block stat-block">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Trackers</span>
      </div>
      <div class="block stat-block">
        <span class="stat-value" id="stat-done">0</span>
        <span class="stat-label">Done Today</span>
      </div>
      <div class="block stat-block">
        <span class="stat-value" id="stat-streak">0</span>
        <span class="stat-label">Best Streak</span>
      </div>
      <div class="block stat-block">
        <span class="stat-value" id="stat-expense">₹0</span>
        <span class="stat-label">Spent Today</span>
      </div>
    </section>

    <!-- Add tracker -->
    <section class="block add-block">
      <h2>+ Add a Tracker</h2>
      <form id="tracker-form" autocomplete="off">
        <div class="form-row">
          <input type="text" id="tracker-name" placeholder="Name (e.g., Pages Read, Gym)" maxlength="40" required />
          <select id="tracker-icon">
            <option value="⭐">⭐</option><option value="📖">📖</option><option value="💪">💪</option>
            <option value="🏋️">🏋️</option><option value="✍️">✍️</option><option value="💰">💰</option>
            <option value="🍰">🍰</option><option value="🏃">🏃</option><option value="💧">💧</option>
            <option value="🧘">🧘</option><option value="💻">💻</option><option value="😴">😴</option>
          </select>
        </div>
        <div class="form-row">
          <select id="tracker-type">
            <option value="check">✅ Simple check-off (e.g., Gym, Writing)</option>
            <option value="counter">🔢 Daily counter (e.g., Pages read)</option>
            <option value="target">🎯 Yearly countdown target (e.g., 10,000 pushups)</option>
            <option value="cheat">🍰 Cheat-day allowance (e.g., Sugar days/year)</option>
            <option value="expense">💰 Expense tracking</option>
          </select>
          <input type="number" id="tracker-target" placeholder="Target / Allowance" min="1" class="hidden" />
        </div>
        <button type="submit" class="btn-primary">Add Tracker</button>
      </form>
    </section>

    <!-- Tracker blocks -->
    <section id="tracker-grid" class="tracker-grid"></section>
    <div id="empty-state" class="block empty-state">
      <p>🌱 No trackers yet. Add your first one above!</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Consistency — small steps, every day. Data stays in your browser.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
